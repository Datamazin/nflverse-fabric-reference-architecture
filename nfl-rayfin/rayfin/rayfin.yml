id: nfl-rayfin
name: nfl-rayfin
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://127.0.0.1:5173
      - https://merry-eagle-6b840a7fd0-eastus.webapp.fabricapps.net
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
connectors:
  - name: nflmodel
    config:
      workspaceId: f4f174fc-f02b-4241-9138-815fabd9eb6d
      itemId: a920a06d-b1a1-4391-98d7-f41556b0df05
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
    type: fabric-semanticmodel
